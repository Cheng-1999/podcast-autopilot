# Copy this file to default.yaml (or another name) and edit as needed.
# default.yaml itself is git-ignored, so personal paths never get committed.

name: default

# Optional: an ffmpeg install directory (containing ffmpeg.exe and ffprobe.exe)
# or the path to ffmpeg.exe itself; ffprobe.exe is taken from the same folder.
# Resolution order is: this value > PATH > tools/ffmpeg/bin.
ffmpeg_path: null

loudness_target_i: -16.0
loudness_target_tp: -1.5

denoise:
  engine: auto # auto|noisereduce|afftdn|off

voice_chain:
  highpass_hz: 80
  deesser_enabled: true
  deesser_frequency: 0.5
  deesser_intensity: 0.3
  deesser_max: 0.5
  compressor_threshold_db: -18
  compressor_ratio: 3
  compressor_attack_ms: 15
  compressor_release_ms: 250
  loudness_target_i: -16
  loudness_target_tp: -1.5
  loudness_target_lra: 11
  adeclick: false
  adeclip: false

# faster-whisper model size: "small" (default) or "medium". Cached under
# tools/models/ (gitignored), downloaded from Hugging Face on first use.
whisper_model_size: small

# Filler-word proposal detection (see `plan-fillers`); a word only counts
# when isolated by a pause > filler_pause_threshold_s on both sides and its
# recognition probability is above filler_min_probability.
filler_words: [嗯, 呃, 啊, 那個, 就是說, 然後]
filler_pause_threshold_s: 0.2
filler_min_probability: 0.5

# Silence tightening (used by `plan-pauses`).
# `noise` is the silencedetect threshold. "<n>LU" is relative to the file's
# integrated loudness ("0LU" = -16dB on a -16 LUFS cleaned part, -35dB on a
# -35 LUFS raw take); an absolute value such as "-35dB" is passed through as is.
pauses:
  noise: "0LU"
  min_duration: 0.6
  max_keep: 1.5
  target: 0.6
  guard: 0.15
  min_segment: 0.5
  head: 0.3
  tail: 1.0
  max_removed_fraction: 0.25
