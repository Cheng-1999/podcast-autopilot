[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-autopilot"
version = "0.1.0"
description = "CPU-only podcast post-production autopilot: probe, edit-plan, audit, apply, receipts."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
