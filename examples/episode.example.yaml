# Copy this file, point `parts` at your own part WAVs (raw for `run`,
# cleaned+pause-applied for `assemble`), and run e.g.:
#   python -m podcast_autopilot run examples/episode.example.yaml
# Paths below are relative to this file's directory unless absolute.
#
# The two `parts` below are placeholders: `example-part-1.wav` and
# `example-part-2.wav` don't ship with the repo (no audio is committed).
# `run.ps1` generates them automatically (synthetic tone + white noise, via
# `python -m podcast_autopilot make-example`) the first time you run this
# exact file, so the one-command run works right after a fresh clone.

title: "Episode 3"
episode: 3

parts:
  - example-part-1.wav
  - example-part-2.wav

# Optional: crossfaded 1.0s into/out of the joined parts.
intro: null
outro: null

# Optional: background music, sidechain-ducked under the voice.
bgm: null
# bgm:
#   path: bgm.wav
#   gain_db: -18
#   duck:
#     threshold: 0.03
#     ratio: 8
#     attack: 5
#     release: 300

# Chapter markers on the final assembled timeline ("mm:ss" or "hh:mm:ss").
# Every start must fall inside the assembled episode; the placeholder parts
# are 20 s each, so "00:20" is where the second part begins.
chapters:
  - start: "00:00"
    title: "Intro"
  - start: "00:20"
    title: "Main topic"

tags:
  artist: "Podcast Host"
  album: "Podcast Name"
  year: 2026
  genre: "Podcast"
  comment: "Assembled by podcast-autopilot"
